name: Build Backend para Deploy

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Compilar projeto
        run: npm run build

      - name: Publicar build no branch dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin dist >/dev/null 2>&1; then
            git fetch origin dist
            git checkout -B dist origin/dist
          else
            git checkout --orphan dist
          fi

          git rm -rf . --ignore-unmatch || true
          cp -r dist/. .

          git add -A
          git commit -m "Deploy build ${{ github.sha }}" || echo "No changes to commit"
          git push "https://x-access-token:${{ github.token }}@github.com/Pedro-Paulo-Lourenco/motorVTT-Backend.git" HEAD:dist
